<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-s="windowTitle"></title>
  <link rel="preload" href="fonts/atkinson-400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <!-- Icons: one sprite, referenced with <use>. Decorative everywhere (aria-hidden). -->
  <svg hidden xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-document" viewBox="0 0 24 24"><path d="M6 2.75h8.2L19.25 7.8V20a1.25 1.25 0 0 1-1.25 1.25H6A1.25 1.25 0 0 1 4.75 20V4A1.25 1.25 0 0 1 6 2.75Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 3v5h5M8 12.5h8M8 16h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4.75" width="18" height="14.5" rx="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.75" fill="currentColor"/><path d="m4 17.5 5-5 3.5 3.5 2.5-2.5 5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.75" y="5.75" width="13.5" height="12.5" rx="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m16.25 10.25 5-3v9.5l-5-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2.25V15.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.5" cy="15.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2.75 6.5A1.75 1.75 0 0 1 4.5 4.75h4.4l2 2.25h8.6a1.75 1.75 0 0 1 1.75 1.75v9.75a1.75 1.75 0 0 1-1.75 1.75h-15a1.75 1.75 0 0 1-1.75-1.75Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-other" viewBox="0 0 24 24"><path d="M6 2.75h8.2L19.25 7.8V20a1.25 1.25 0 0 1-1.25 1.25H6A1.25 1.25 0 0 1 4.75 20V4A1.25 1.25 0 0 1 6 2.75Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.75 3.25h10.5a1 1 0 0 1 1 1v16.5l-6.25-4.5-6.25 4.5V4.25a1 1 0 0 1 1-1Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-bookmark-folder" viewBox="0 0 24 24"><path d="M2.75 6.5A1.75 1.75 0 0 1 4.5 4.75h4.4l2 2.25h8.6a1.75 1.75 0 0 1 1.75 1.75v9.75a1.75 1.75 0 0 1-1.75 1.75h-15a1.75 1.75 0 0 1-1.75-1.75Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12.75 9.75h4.5v7.5l-2.25-1.6-2.25 1.6Z" fill="currentColor"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M13.5 4.75h5.75v5.75M19 5l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.25 13.5v5a1.75 1.75 0 0 1-1.75 1.75h-10A1.75 1.75 0 0 1 3.75 18.5v-10A1.75 1.75 0 0 1 5.5 6.75h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.25h5V6.5M6.5 6.5l1 13.25h9l1-13.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-reveal" viewBox="0 0 24 24"><path d="M2.75 6.5A1.75 1.75 0 0 1 4.5 4.75h4.4l2 2.25h8.6a1.75 1.75 0 0 1 1.75 1.75v9.75a1.75 1.75 0 0 1-1.75 1.75h-15a1.75 1.75 0 0 1-1.75-1.75Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 13.5h5.5m-2.25-2.5 2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><rect x="3.75" y="3.75" width="16.5" height="16.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 16.5v-2.25a4 4 0 0 1 4-4h4m-2.5-2.5 2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 22 20.5H2Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.15" fill="currentColor"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.75" r="1.15" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app" id="app" data-view="start" role="tabpanel" aria-labelledby="view-search">
    <header class="top">
      <!-- VFS-49 R1: «Buscador» and «Chat», one tab stop; the arrow keys, Home and End choose.
           Beside the search box, so the results keep their height (VFS-35); the Chat tab
           takes it into its own header. Hidden until the shell answers ai_status: a build
           without the `ai` feature has no Chat. -->
      <nav class="views" id="views" hidden>
        <div class="views-tabs" role="tablist" data-s-label="viewsLabel">
          <button id="view-search" class="view-tab" type="button" role="tab" aria-controls="app" aria-selected="true">
            <svg aria-hidden="true"><use href="#i-search"/></svg><span data-s="viewSearch"></span></button>
          <button id="view-chat" class="view-tab" type="button" role="tab" aria-controls="chat" aria-selected="false" tabindex="-1">
            <svg aria-hidden="true"><use href="#i-chat"/></svg><span data-s="viewChat"></span></button>
        </div>
      </nav>
      <h1 class="visually-hidden" data-s="appName"></h1>
      <div class="search">
        <label class="search-label" for="q" data-s="searchLabel"></label>
        <div class="search-field">
          <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" type="search" role="combobox" autocomplete="off" spellcheck="false"
                 aria-autocomplete="list" aria-controls="results" aria-expanded="false"
                 aria-describedby="q-hint" enterkeyhint="search" maxlength="1024">
          <button id="q-clear" class="icon-btn" type="button" hidden>
            <svg aria-hidden="true"><use href="#i-close"/></svg>
            <span class="visually-hidden" data-s="clearSearch"></span>
          </button>
        </div>
        <p id="q-hint" class="visually-hidden" data-s="searchHint"></p>
      </div>
      <!-- VFS-49 R13: while the chat can answer, the query can start a new chat. -->
      <button id="ask-line" class="ask-line" type="button" hidden>
        <svg aria-hidden="true"><use href="#i-chat"/></svg><span id="ask-line-text"></span></button>
      <span id="dev-badge" class="dev-badge" hidden data-s="devBadge"></span>
    </header>

    <!-- The filter line (VFS-38 R7, VFS-42 R1): «Tipo», «Fecha» and «Más filtros», one quiet
         row. Labels are kept for screen readers; the chosen value is the text. -->
    <form class="filters" id="filters" aria-labelledby="filters-title">
      <h2 id="filters-title" class="visually-hidden" data-s="filtersTitle"></h2>
      <button id="f-type" class="filter" type="button" popovertarget="f-type-pop" aria-describedby="f-type-label">
        <span id="f-type-text"></span>
        <svg aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <span id="f-type-label" class="visually-hidden" data-s="fType"></span>
      <div id="f-type-pop" class="type-pop" popover>
        <fieldset class="kinds">
          <legend data-s="fType"></legend>
          <div class="chips" id="kind-chips"></div>
        </fieldset>
      </div>
      <label class="filter filter-select">
        <span class="visually-hidden" data-s="fDate"></span>
        <select id="f-date"></select>
      </label>
      <!-- VFS-38 R7: size, folder and, while bookmarks are included, the source; a popover, or a
           row unfolded below the line where the Popover API is missing. -->
      <button id="f-more" class="filter" type="button" popovertarget="f-more-pop" aria-controls="f-more-pop">
        <span id="f-more-text"></span>
        <svg aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <div id="f-more-pop" class="more-pop" popover>
        <div class="field">
          <label for="f-size" data-s="fSize"></label>
          <select id="f-size"></select>
        </div>
        <div class="field">
          <label for="f-folder" data-s="fFolder"></label>
          <select id="f-folder"></select>
        </div>
        <div class="field" id="f-source-field" hidden>
          <label for="f-source" data-s="fSource"></label>
          <select id="f-source"></select>
        </div>
      </div>
      <div class="range" id="date-range" hidden>
        <div class="field">
          <label for="f-from" data-s="fFrom"></label>
          <input id="f-from" type="date">
        </div>
        <div class="field">
          <label for="f-to" data-s="fTo"></label>
          <input id="f-to" type="date">
        </div>
        <p id="range-error" class="range-error" role="alert"></p>
      </div>
    </form>

    <!-- VFS-38 R8: while any filter is on, the ones behind «Más filtros» as removable chips,
         then «Quitar filtros (N)», which clears every filter (VFS-42 R5: not the tab). -->
    <div class="active-filters" id="active-filters" role="group" data-s-label="activeFiltersTitle" hidden>
      <div class="filter-tags" id="filter-tags"></div>
      <button id="f-clear" class="btn btn-quiet" type="button" aria-controls="filters" data-s="clearFilters"></button>
    </div>

    <div class="notices" id="notices">
      <div id="banner-error" class="banner banner-error" role="alert" hidden>
        <svg aria-hidden="true"><use href="#i-warn"/></svg>
        <p id="banner-error-text"></p>
        <button type="button" class="btn btn-quiet" id="banner-error-close" data-s="dismiss"></button>
      </div>
      <div id="banner-unavailable" class="banner banner-warn" hidden>
        <svg aria-hidden="true"><use href="#i-warn"/></svg>
        <p id="banner-unavailable-text"></p>
        <button type="button" class="btn btn-quiet" id="banner-unavailable-close" data-s="understood"></button>
      </div>
      <div id="banner-update" class="banner banner-info" hidden>
        <svg aria-hidden="true"><use href="#i-info"/></svg>
        <p id="banner-update-text" aria-live="polite"></p>
        <progress id="update-progress" max="100" hidden></progress>
        <button type="button" class="btn btn-primary" id="update-action" hidden></button>
        <button type="button" class="btn btn-quiet" id="update-later" data-s="updateLater"></button>
      </div>
      <!-- VFS-27 R4: content search is offered once, after the first name scan. -->
      <div id="banner-content-offer" class="banner banner-info" hidden>
        <svg aria-hidden="true"><use href="#i-info"/></svg>
        <p><span id="content-offer-text"></span> <strong id="content-offer-warn"></strong></p>
        <button type="button" class="btn btn-primary" id="content-offer-yes" data-s="contentOfferYes"></button>
        <button type="button" class="btn btn-quiet" id="content-offer-no" data-s="contentOfferNo"></button>
      </div>
      <!-- VFS-27 R11: nothing is deleted without one of these choices. -->
      <div id="banner-content-damaged" class="banner banner-warn" hidden>
        <svg aria-hidden="true"><use href="#i-warn"/></svg>
        <p data-s="contentDamaged"></p>
        <button type="button" class="btn btn-primary" id="content-rebuild" data-s="contentRebuild"></button>
        <button type="button" class="btn btn-quiet" id="content-disable" data-s="contentDisable"></button>
      </div>
      <div id="banner-scan" class="banner banner-info" hidden>
        <svg aria-hidden="true"><use href="#i-info"/></svg>
        <p data-s="firstScanNote"></p>
      </div>
    </div>

    <main class="results" id="main">
      <h2 class="visually-hidden" data-s="resultsTitle"></h2>
      <!-- VFS-42 R1, R7: the results header, shown with the results view: the tabs «Nombres» and
           «Documentos» (one tab stop; the arrow keys, Home and End choose), then the count and,
           on «Nombres», «Orden» (VFS-12), which wrap below when the row is short. -->
      <div class="results-head" id="results-head" hidden>
        <div id="tabs" class="tabs" role="tablist" data-s-label="tabsLabel">
          <button id="tab-names" class="tab" type="button" role="tab" data-tab="names" aria-controls="results-panel" aria-selected="true" data-s="tabNames"></button>
          <button id="tab-documents" class="tab" type="button" role="tab" data-tab="documents" aria-controls="results-panel" aria-selected="false" tabindex="-1" data-s="tabDocuments"></button>
        </div>
        <div class="results-meta">
          <p class="summary-line"><strong id="summary" class="summary"></strong></p>
          <label class="filter filter-select" id="f-sort-pill">
            <span class="visually-hidden" data-s="fSort"></span>
            <select id="f-sort"></select>
          </label>
        </div>
      </div>
      <div id="results-panel" class="results-panel" role="tabpanel" aria-labelledby="tab-names" data-tab="names">
        <p id="fuzzy-note" class="fuzzy-note" hidden data-s="fuzzyNote"></p>
        <!-- VFS-27 R12, R13: hits inside documents, on «Documentos» only (VFS-42 R3). -->
        <section id="content-hits" class="content-hits" aria-labelledby="content-title" hidden>
          <h3 id="content-title" class="visually-hidden" data-s="contentTitle"></h3>
          <div id="content-notes" class="content-notes" aria-live="polite"></div>
          <ul id="content-list" class="content-list" role="list"></ul>
          <button id="content-more" class="link-btn" type="button" hidden data-s="contentMore"></button>
        </section>
        <div class="list-wrap">
          <div id="results" class="list" role="listbox" tabindex="-1" data-s-label="resultsTitle">
            <div class="sizer" id="sizer" role="presentation"></div>
          </div>
          <div id="empty" class="empty" hidden></div>
        </div>
        <div class="details-line">
          <p class="details" id="details" aria-live="off"></p>
          <!-- VFS-49 R13: a new chat limited to the selected document, in the Chat tab. -->
          <button id="ask-doc" class="btn btn-quiet ask-doc" type="button" hidden>
            <svg aria-hidden="true"><use href="#i-chat"/></svg><span data-s="askDocButton"></span></button>
        </div>
      </div>
    </main>

    <footer class="bottom">
      <div class="status-text">
        <progress id="scan-progress" hidden></progress>
        <p id="status-text"></p>
      </div>
      <button id="pause" class="btn btn-quiet" type="button" hidden></button>
      <!-- VFS-27 R8, R15: content progress, with «Pausar» / «Reanudar» or «Reintentar». -->
      <p id="content-line" class="content-line" hidden></p>
      <button id="content-action" class="btn btn-quiet" type="button" hidden data-s="contentPause"></button>
      <button id="rescan-now" class="btn btn-quiet" type="button" hidden data-s="rescanAll"></button>
      <button id="open-feedback" class="btn btn-quiet" type="button" data-s="feedbackButton"></button>
      <button id="open-folders" class="btn btn-quiet" type="button"></button>
      <button id="open-settings" class="btn btn-quiet" type="button" data-s="settingsButton"></button>
    </footer>
  </div>

  <!-- VFS-49: the Chat tab. The chats on the left (R2), the conversation (R8) and the composer
       (R5, R6); the setup page while AI cannot answer (R12). -->
  <section class="chat" id="chat" role="tabpanel" aria-labelledby="view-chat" hidden>
    <aside class="chat-side" id="chat-side" aria-labelledby="chat-side-title">
      <h2 id="chat-side-title" class="visually-hidden" data-s="chatListTitle"></h2>
      <button id="chat-new" class="btn btn-primary chat-new" type="button">
        <svg aria-hidden="true"><use href="#i-plus"/></svg><span data-s="chatNew"></span></button>
      <label for="chat-filter" class="visually-hidden" data-s="chatFilter"></label>
      <input id="chat-filter" class="chat-filter" type="text" autocomplete="off" spellcheck="false" data-s-placeholder="chatFilter">
      <div id="chat-list" class="chat-list"></div>
      <p class="chat-side-note" data-s="chatSideNote"></p>
    </aside>
    <div class="chat-main">
      <div class="chat-head" id="chat-head">
        <button id="chat-side-toggle" class="btn btn-quiet chat-side-toggle" type="button" aria-controls="chat-side" aria-expanded="false" data-s="chatListTitle"></button>
      </div>
      <div id="chat-setup" class="chat-setup" hidden>
        <h2 data-s="chatSetupTitle"></h2>
        <p data-s="chatSetupBody"></p>
        <p id="chat-setup-store" class="chat-setup-note" data-s="chatSetupStore" hidden></p>
        <button id="chat-setup-open" class="btn btn-primary" type="button" data-s="chatSetupButton"></button>
      </div>
      <div id="chat-body" class="chat-body">
        <div class="chat-scroll" id="chat-scroll">
          <div id="chat-empty" class="chat-empty">
            <h2 id="chat-empty-title"></h2>
            <p id="chat-empty-body"></p>
            <div id="chat-examples" class="chat-examples"></div>
          </div>
          <ol id="chat-turns" class="chat-turns" aria-live="polite"></ol>
        </div>
        <form id="chat-form" class="chat-composer">
          <label for="chat-input" class="visually-hidden" data-s="chatInputLabel"></label>
          <textarea id="chat-input" rows="2" maxlength="2000" spellcheck="true" data-s-placeholder="chatPlaceholder"></textarea>
          <div class="chat-composer-bar">
            <label class="chat-select"><span class="visually-hidden" data-s="chatScopeLabel"></span>
              <select id="chat-scope"></select></label>
            <span class="chat-composer-gap"></span>
            <label class="chat-select chat-model"><span class="visually-hidden" data-s="aiModelLabel"></span>
              <select id="ai-model"></select></label>
            <button id="chat-send" class="btn btn-primary chat-send" type="submit">
              <svg aria-hidden="true"><use href="#i-send"/></svg><span class="visually-hidden" data-s="chatSend"></span></button>
            <button id="chat-cancel" class="btn" type="button" hidden data-s="cancel"></button>
          </div>
        </form>
        <p id="chat-meta" class="chat-meta" aria-live="off"></p>
      </div>
    </div>
  </section>

  <p id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="folders" class="drawer" aria-labelledby="folders-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="folders-title" data-s="foldersTitle"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <p class="drawer-intro" data-s="foldersIntro"></p>
    <div id="folders-msg" class="banner" role="alert" hidden>
      <svg aria-hidden="true"><use href="#i-warn"/></svg>
      <p id="folders-msg-text"></p>
    </div>
    <ul class="roots" id="roots" role="list"></ul>
    <!-- VFS-6: folded so the folder list above keeps the panel's height; the line says whether
         bookmarks are included. VFS-44 R1: one switch per browser found, filled by main.js. -->
    <details class="bookmarks-setting" id="bookmarks-setting">
      <summary><span id="bookmarks-title" data-s="bookmarksTitle"></span> <span id="bookmarks-summary" class="bookmarks-summary"></span></summary>
      <p class="bookmarks-intro" data-s="bookmarksIntro"></p>
      <div id="bookmarks-browsers" class="bookmarks-browsers"></div>
    </details>
    <div class="drawer-foot">
      <button id="add-folder" class="btn btn-primary" type="button" data-s="addFolder"></button>
      <button id="rescan-all" class="btn btn-quiet" type="button" data-s="rescanAll"></button>
    </div>
  </dialog>

  <!-- VFS-45: Ajustes is a centered window: a section list (one tab stop; Up, Down, Home and End
       choose) ending with the version, and the chosen section. VFS-22: language; VFS-21: the
       update check; VFS-27: documents; VFS-28: AI; VFS-33, VFS-34: advanced. -->
  <dialog id="settings" class="settings" aria-labelledby="settings-title" closedby="closerequest" data-light-dismiss>
    <nav class="settings-nav">
      <h2 id="settings-title" data-s="settingsTitle"></h2>
      <div id="settings-tabs" class="settings-tabs" role="tablist" aria-orientation="vertical" aria-labelledby="settings-title">
        <button id="stab-general" class="stab" type="button" role="tab" aria-controls="spanel-general" aria-selected="true" data-s="settingsTabGeneral"></button>
        <button id="stab-documents" class="stab" type="button" role="tab" aria-controls="spanel-documents" aria-selected="false" tabindex="-1" data-s="settingsTabDocuments"></button>
        <button id="stab-ai" class="stab" type="button" role="tab" aria-controls="spanel-ai" aria-selected="false" tabindex="-1" data-s="settingsTabAi" hidden></button>
        <button id="stab-advanced" class="stab" type="button" role="tab" aria-controls="spanel-advanced" aria-selected="false" tabindex="-1" data-s="advancedTitle"></button>
        <button id="stab-about" class="stab" type="button" role="tab" aria-controls="spanel-about" aria-selected="false" tabindex="-1" data-s="settingsTabAbout"></button>
      </div>
      <p id="settings-version" class="settings-version"></p>
    </nav>
    <div class="settings-main">
      <form method="dialog" class="settings-close"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
      <div id="spanel-general" class="spanel" role="tabpanel" aria-labelledby="stab-general">
        <h3 class="spanel-title" data-s="settingsTabGeneral"></h3>
        <section class="setting setting-row">
          <label for="language" data-s="languageLabel"></label>
          <select id="language"></select>
        </section>
        <section class="setting" aria-labelledby="updates-title">
          <h3 id="updates-title" data-s="updatesTitle"></h3>
          <label class="toggle"><input type="checkbox" id="updates-on"> <span data-s="updatesToggle"></span></label>
          <p class="bookmarks-intro bookmarks-status" data-s="updatesIntro"></p>
        </section>
      </div>
      <div id="spanel-documents" class="spanel" role="tabpanel" aria-labelledby="stab-documents" hidden>
        <h3 class="spanel-title" data-s="settingsTabDocuments"></h3>
        <!-- VFS-27 R5, R14: the content switch, the store's size, unread counts and delete. -->
        <section class="setting" aria-labelledby="content-set-title">
          <h3 id="content-set-title" data-s="contentSetTitle"></h3>
          <label class="toggle"><input type="checkbox" id="content-on"> <span data-s="contentToggle"></span></label>
          <p class="bookmarks-intro bookmarks-status" data-s="contentIntro"></p>
          <p class="bookmarks-status" id="content-store" hidden></p>
          <div id="content-unread" class="content-unread" hidden>
            <p class="bookmarks-status" data-s="contentUnreadTitle"></p>
            <ul id="content-unread-list" role="list"></ul>
          </div>
          <button id="content-delete" class="btn btn-quiet" type="button" hidden data-s="contentDelete"></button>
        </section>
        <!-- VFS-29 R1: «Búsqueda por significado», below the content switch, off by default and
             available only while content search is on. Turning it on asks first (R1a). -->
        <section class="setting" aria-labelledby="meaning-set-title">
          <h3 id="meaning-set-title" data-s="meaningSetTitle"></h3>
          <label class="toggle"><input type="checkbox" id="meaning-on"> <span data-s="meaningToggle"></span></label>
          <p class="bookmarks-intro bookmarks-status" data-s="meaningIntro"></p>
          <p class="bookmarks-status" id="meaning-needs-content" data-s="meaningNeedsContent" hidden></p>
          <p class="bookmarks-status" id="meaning-status" role="status" hidden></p>
          <button id="meaning-action" class="btn btn-quiet" type="button" hidden></button>
        </section>
      </div>
      <div id="spanel-ai" class="spanel" role="tabpanel" aria-labelledby="stab-ai" hidden>
        <h3 class="spanel-title" data-s="settingsTabAi"></h3>
        <!-- VFS-28 R1: «Preguntar a sus documentos (IA)», off by default. The key field is
             write-only: once saved, only its last 4 characters are shown. Hidden until the shell
             answers ai_status: a build without the `ai` feature never shows it. -->
        <section id="ai-section" class="setting" aria-labelledby="ai-set-title" hidden>
          <h3 id="ai-set-title" data-s="aiSetTitle"></h3>
          <label class="toggle"><input type="checkbox" id="ai-on"> <span data-s="aiToggle"></span></label>
          <p class="bookmarks-intro bookmarks-status" data-s="aiIntro"></p>
          <div id="ai-body" class="ai-body" hidden>
            <fieldset id="ai-providers" class="ai-providers"><legend data-s="aiProviderLabel"></legend></fieldset>
            <p id="ai-key-line" class="bookmarks-status"></p>
            <form id="ai-key-form" class="ai-key-form">
              <label for="ai-key" data-s="aiKeyLabel"></label>
              <input id="ai-key" type="password" autocomplete="off" spellcheck="false">
              <button class="btn" type="submit" data-s="aiKeySave"></button>
            </form>
            <div class="ai-key-actions">
              <button id="ai-test" class="btn" type="button" data-s="aiTest"></button>
              <button id="ai-replace" class="btn btn-quiet" type="button" data-s="aiReplace"></button>
              <button id="ai-delete" class="btn btn-quiet" type="button" data-s="aiDelete"></button>
            </div>
            <p id="ai-msg" class="bookmarks-status" role="status" hidden></p>
            <p class="bookmarks-intro" data-s="aiTestHelp"></p>
            <div class="ai-cap">
              <label for="ai-cap" data-s="aiCapLabel"></label>
              <input id="ai-cap" type="number" min="0" step="0.5" inputmode="decimal">
            </div>
            <p id="ai-month" class="bookmarks-status"></p>
            <button id="ai-open-record" class="btn btn-quiet" type="button" data-s="aiRecordOpen"></button>
            <!-- VFS-49 R10: the chats kept on this PC. -->
            <button id="ai-chats-clear" class="btn btn-quiet" type="button" data-s="chatClearAll"></button>
          </div>
        </section>
      </div>
      <div id="spanel-advanced" class="spanel" role="tabpanel" aria-labelledby="stab-advanced" hidden>
        <h3 class="spanel-title" data-s="advancedTitle"></h3>
        <!-- VFS-33: the default folder exclusions; VFS-34: «Filtro de archivos». -->
        <section class="setting setting-advanced">
          <label class="toggle"><input type="checkbox" id="include-all"> <span data-s="includeAllToggle"></span></label>
          <p class="bookmarks-intro bookmarks-status" data-s="includeAllIntro"></p>
          <!-- VFS-34: «Filtro de archivos», global for every folder. -->
          <section class="file-filter" aria-labelledby="file-filter-title">
            <h3 id="file-filter-title" data-s="fileFilterTitle"></h3>
            <p class="bookmarks-intro" data-s="fileFilterIntro"></p>
            <ul id="file-filter-list" class="file-filter-list"></ul>
            <form id="file-filter-form" class="file-filter-add">
              <label for="file-filter-pattern" class="visually-hidden" data-s="fileFilterPlaceholder"></label>
              <input id="file-filter-pattern" type="text" autocomplete="off" spellcheck="false">
              <button id="file-filter-add" class="btn" type="submit">
                <svg aria-hidden="true"><use href="#i-plus"/></svg><span class="visually-hidden" data-s="fileFilterAdd"></span>
              </button>
            </form>
            <p id="file-filter-msg" class="bookmarks-intro" role="status"></p>
            <button id="file-filter-reset" class="btn btn-quiet" type="button" data-s="fileFilterReset"></button>
            <p class="bookmarks-intro" data-s="fileFilterBuiltIn"></p>
            <!-- Shown only while content search is on (VFS-27). -->
            <div id="content-max-row" class="file-filter-limit" hidden>
              <label for="content-max-mb" data-s="contentMaxLabel"></label>
              <input id="content-max-mb" type="number" min="0" max="100000" step="1" inputmode="numeric">
              <p class="bookmarks-intro" data-s="contentMaxHint"></p>
            </div>
          </section>
        </section>
      </div>
      <!-- VFS-45 R5, R6: the version, the update state and the credits; the license name and
           «Ver en GitHub» open fixed project pages (LICENSE.md, the repository). -->
      <div id="spanel-about" class="spanel about" role="tabpanel" aria-labelledby="stab-about" hidden>
        <div class="about-head">
          <svg class="about-logo" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#a3471f"/><g transform="translate(152 152) scale(7.2)"><path d="M6 26a7 7 0 0 1 7-7h23l9 9h42a7 7 0 0 1 7 7v47a7 7 0 0 1-7 7H13a7 7 0 0 1-7-7z" fill="#faf8f3"/><g stroke="#a3471f" stroke-width="4" stroke-linecap="round"><line x1="46" y1="56" x2="24" y2="64"/><line x1="46" y1="56" x2="70" y2="50"/><line x1="46" y1="56" x2="40" y2="79"/><line x1="46" y1="56" x2="72" y2="77"/><line x1="40" y1="79" x2="72" y2="77"/><line x1="70" y1="50" x2="72" y2="77"/></g><g fill="#a3471f"><circle cx="24" cy="64" r="5.5"/><circle cx="70" cy="50" r="5.5"/><circle cx="40" cy="79" r="5.5"/><circle cx="72" cy="77" r="5.5"/></g><circle cx="46" cy="56" r="9" fill="#1f1e1b" stroke="#a3471f" stroke-width="3.5"/></g></svg>
          <h3 class="about-name" data-s="aboutName"></h3>
          <p class="about-tagline" data-s="aboutTagline"></p>
          <p class="about-version"><span id="about-version" class="about-pill"></span></p>
          <p id="about-update" class="about-update" role="status"></p>
          <button id="about-update-action" class="btn" type="button" hidden data-s="aboutCheck"></button>
        </div>
        <dl class="about-facts">
          <div><dt data-s="aboutMadeBy"></dt><dd data-s="aboutAuthor"></dd></div>
          <div><dt data-s="aboutLicense"></dt><dd><button id="about-license" class="link-btn" type="button" data-s="aboutLicenseName"></button></dd></div>
          <div><dt data-s="aboutSource"></dt><dd><button id="about-source" class="link-btn" type="button" data-s="aboutSourceOpen"></button></dd></div>
        </dl>
        <p class="about-privacy" data-s="aboutPrivacy"></p>
      </div>
    </div>
  </dialog>

  <dialog id="copies" class="drawer" aria-labelledby="copies-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="copies-title"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <p class="drawer-intro" data-s="copiesIntro"></p>
    <ul class="roots" id="copies-list" role="list"></ul>
  </dialog>

  <!-- VFS-10: the folders of one chosen folder that could not be read. -->
  <dialog id="unreadable" class="drawer" aria-labelledby="unreadable-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="unreadable-title" data-s="unreadableTitle"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <p class="drawer-intro" data-s="unreadableIntro"></p>
    <ul class="roots" id="unreadable-list" role="list"></ul>
    <p class="drawer-intro" id="unreadable-more" hidden></p>
    <p class="drawer-intro" data-s="unreadableHint"></p>
  </dialog>

  <!-- VFS-20: "Enviar comentarios". The report is built in the shell; nothing is sent from here. -->
  <dialog id="feedback" class="drawer" aria-labelledby="feedback-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="feedback-title" data-s="feedbackTitle"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <p class="drawer-intro" data-s="feedbackIntro"></p>
    <div class="feedback-body">
      <label class="feedback-label" for="feedback-text" data-s="feedbackLabel"></label>
      <textarea id="feedback-text" rows="5" maxlength="20000"></textarea>
      <details id="feedback-details">
        <summary data-s="feedbackPreview"></summary>
        <p class="feedback-hint" data-s="feedbackPreviewNote"></p>
        <textarea id="feedback-report" rows="12" readonly spellcheck="false" data-s-label="feedbackPreview"></textarea>
      </details>
      <p class="feedback-hint" data-s="feedbackHowTo"></p>
      <p class="feedback-hint" data-s="feedbackPublic"></p>
      <div id="feedback-msg" class="banner" role="status" hidden>
        <svg aria-hidden="true"><use href="#i-info"/></svg>
        <p id="feedback-msg-text"></p>
      </div>
    </div>
    <div class="drawer-foot">
      <button id="feedback-github" class="btn btn-primary" type="button" data-s="feedbackGithub"></button>
      <button id="feedback-export" class="btn btn-quiet" type="button" data-s="feedbackExport"></button>
    </div>
  </dialog>

  <!-- VFS-34 R2: adding a pattern that hides more than 1,000 files asks first. -->
  <dialog id="confirm-filter" class="confirm" aria-labelledby="confirm-filter-title" aria-describedby="confirm-filter-desc">
    <h2 id="confirm-filter-title" data-s="fileFilterConfirmTitle"></h2>
    <p id="confirm-filter-desc"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-primary" value="add" data-s="fileFilterConfirmAdd"></button>
    </form>
  </dialog>

  <dialog id="confirm-meaning" class="confirm" aria-labelledby="confirm-meaning-title" aria-describedby="confirm-meaning-desc">
    <h2 id="confirm-meaning-title" data-s="meaningConfirmTitle"></h2>
    <p id="confirm-meaning-desc"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-primary" value="enable" data-s="meaningConfirmYes"></button>
    </form>
  </dialog>

  <dialog id="confirm-content-delete" class="confirm" aria-labelledby="confirm-content-title" aria-describedby="confirm-content-desc">
    <h2 id="confirm-content-title" data-s="contentDeleteTitle"></h2>
    <p id="confirm-content-desc" data-s="contentDeleteBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="delete" data-s="contentDeleteConfirm"></button>
    </form>
  </dialog>

  <dialog id="confirm-remove" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <h2 id="confirm-title" data-s="removeTitle"></h2>
    <p class="confirm-path" id="confirm-path"></p>
    <p id="confirm-desc" data-s="removeBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="remove" data-s="removeConfirm"></button>
    </form>
  </dialog>
  <!-- VFS-28 R11: «Qué se ha enviado». -->
  <dialog id="ai-record" class="drawer" aria-labelledby="ai-record-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="ai-record-title" data-s="aiRecordTitle"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <p class="bookmarks-intro" data-s="aiRecordIntro"></p>
    <p id="ai-record-empty" class="bookmarks-status" data-s="aiRecordEmpty"></p>
    <ul id="ai-record-list" class="ai-record-list" role="list"></ul>
    <button id="ai-record-clear" class="btn btn-quiet" type="button" data-s="aiRecordClear"></button>
  </dialog>

  <!-- VFS-49 R2, R10: deleting one chat, or all of them. -->
  <dialog id="confirm-chat-delete" class="confirm" aria-labelledby="confirm-chat-delete-title" aria-describedby="confirm-chat-delete-desc">
    <h2 id="confirm-chat-delete-title" data-s="chatDeleteTitle"></h2>
    <p id="confirm-chat-delete-desc"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="ok" data-s="chatDelete"></button>
    </form>
  </dialog>

  <dialog id="confirm-chats-clear" class="confirm" aria-labelledby="confirm-chats-clear-title" aria-describedby="confirm-chats-clear-desc">
    <h2 id="confirm-chats-clear-title" data-s="chatClearTitle"></h2>
    <p id="confirm-chats-clear-desc" data-s="chatClearBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="ok" data-s="chatClearAll"></button>
    </form>
  </dialog>

  <dialog id="confirm-ai-clear" class="confirm" aria-labelledby="confirm-ai-clear-title" aria-describedby="confirm-ai-clear-desc">
    <h2 id="confirm-ai-clear-title" data-s="aiRecordClearTitle"></h2>
    <p id="confirm-ai-clear-desc" data-s="aiRecordClearBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="clear" data-s="aiRecordClearConfirm"></button>
    </form>
  </dialog>

  <dialog id="confirm-ai-delete" class="confirm" aria-labelledby="confirm-ai-delete-title" aria-describedby="confirm-ai-delete-desc">
    <h2 id="confirm-ai-delete-title" data-s="aiDeleteTitle"></h2>
    <p id="confirm-ai-delete-desc" data-s="aiDeleteBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-danger" value="delete" data-s="aiDeleteConfirm"></button>
    </form>
  </dialog>

  <!-- VFS-28 R2: the OS credential store refused the key. Values are KeyFallback ids. -->
  <dialog id="ai-fallback" class="confirm" aria-labelledby="ai-fallback-title" aria-describedby="ai-fallback-desc">
    <h2 id="ai-fallback-title" data-s="aiFallbackTitle"></h2>
    <p id="ai-fallback-desc" data-s="aiFallbackBody"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn" value="session_only" data-s="aiFallbackSession"></button>
      <button class="btn btn-primary" value="protected_file" data-s="aiFallbackFile"></button>
    </form>
  </dialog>
  <!-- VFS-28 R12: «Bibliografía». -->
  <dialog id="ai-bib" class="drawer" aria-labelledby="ai-bib-title" closedby="closerequest" data-light-dismiss>
    <div class="drawer-head">
      <h2 id="ai-bib-title" data-s="aiBibTitle"></h2>
      <form method="dialog"><button class="icon-btn" value="close">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
        <span class="visually-hidden" data-s="close"></span>
      </button></form>
    </div>
    <div class="ai-ask-body">
      <label class="toggle"><input type="checkbox" id="ai-bib-all"> <span data-s="aiBibAll"></span></label>
      <p id="ai-bib-empty" class="bookmarks-status" data-s="aiBibEmpty" hidden></p>
      <ul id="ai-bib-list" class="ai-bib-list" role="list"></ul>
      <div class="ai-ask-actions">
        <button id="ai-bib-copy" class="btn" type="button" data-s="aiBibCopy"></button>
        <button id="ai-bib-export" class="btn" type="button" data-s="aiBibExport"></button>
      </div>
    </div>
  </dialog>

  <!-- VFS-28 R6: the one-time notice before the first question. -->
  <dialog id="ai-notice" class="confirm" aria-labelledby="ai-notice-title" aria-describedby="ai-notice-body">
    <h2 id="ai-notice-title" data-s="aiNoticeTitle"></h2>
    <p id="ai-notice-body"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" data-s="cancel"></button>
      <button class="btn btn-primary" value="ok" autofocus data-s="aiNoticeOk"></button>
    </form>
  </dialog>

  <!-- VFS-28 R10: the month's cap is reached. -->
  <dialog id="confirm-ai-cap" class="confirm" aria-labelledby="confirm-ai-cap-title" aria-describedby="confirm-ai-cap-desc">
    <h2 id="confirm-ai-cap-title" data-s="aiCapTitle"></h2>
    <p id="confirm-ai-cap-desc"></p>
    <form method="dialog" class="confirm-actions">
      <button class="btn" value="cancel" autofocus data-s="cancel"></button>
      <button class="btn btn-primary" value="ask" data-s="aiCapConfirm"></button>
    </form>
  </dialog>
</body>
</html>
