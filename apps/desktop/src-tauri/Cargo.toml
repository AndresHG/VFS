[package]
name = "vfs-desktop"
description = "VFS desktop app (Tauri 2 shell over vfs-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
name = "vfs_desktop_lib"
crate-type = ["rlib"]

# VFS-8: `webdriver` embeds a W3C WebDriver server (localhost only) so the e2e workflow can
# drive the window on Windows and macOS (no external driver attached to the release build).
# Never enabled in release builds.
[features]
# VFS-28: «Preguntar a sus documentos» (AI) is on in release builds from 0.4; `default = []`
# is the one switch that turns it off. Tests also turn it on through the dev-dependency below.
default = ["ai"]
ai = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
vfs-core.workspace = true
vfs-bookmarks.workspace = true
# VFS-27: content search, without the extractor: Xberg stays in the vfs-extract sidecar.
vfs-content = { path = "../../../crates/vfs-content", default-features = false }
# VFS-28: providers, keys, cost, ai.db and the ask flow.
vfs-ai = { path = "../../../crates/vfs-ai" }
# VFS-29: search by meaning, without the embedder: ONNX Runtime stays in the vfs-embed worker.
vfs-semantic = { path = "../../../crates/vfs-semantic" }
# VFS-29 D21: the model download, through the reqwest and rustls already in the binary.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
serde.workspace = true
log.workspace = true
dunce.workspace = true
# VFS-22 R2: the OS locale picks the UI language.
sys-locale = "0.3"
tauri-plugin-log = "2"
# VFS-21: the update check, the app's only network connection.
tauri-plugin-updater = "2.10"
semver = "1"
# VFS-20: the diagnostic report is one deflated `informe.txt` in a .zip; local time for its name.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[target.'cfg(windows)'.dependencies]
# Reveal through the Shell (issue 107) and the native first-launch splash (issue 108).
windows-sys = { workspace = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }
# The WebView2 types tauri's `with_webview` hands out (VFS-5 R11): same versions as wry's.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# VFS-28: tests turn the AI on explicitly; release builds get it through `default`.
vfs-desktop = { path = ".", features = ["ai"] }
vfs-ai = { path = "../../../crates/vfs-ai", features = ["test-support"] }
vfs-bookmarks = { workspace = true, features = ["test-support"] }
vfs-content = { path = "../../../crates/vfs-content", default-features = false, features = ["test-support"] }
tauri = { version = "2.12", features = ["test"] }
tempfile.workspace = true
rusqlite.workspace = true
