[workspace]
resolver = "2"
members = ["crates/vfs-core", "crates/vfs-bookmarks", "crates/vfs-ai", "crates/vfs-content", "crates/vfs-semantic", "crates/vfs-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.99"  # Xberg 1.4 (vfs-content) needs 1.99; VFS-2 D16
publish = false
license-file = "LICENSE.md"  # PolyForm Shield 1.0.0, not in the SPDX list

[workspace.dependencies]
vfs-core = { path = "crates/vfs-core" }
vfs-bookmarks = { path = "crates/vfs-bookmarks" }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
notify = "8.2"
dunce = "1"
log = "0.4"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_Security", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The extraction worker `vfs-extract` (VFS-2 D16): built for size, unwinding panics kept
# because the worker answers a panicking extraction as a failure. Build with
# `cargo build -p vfs-content --bin vfs-extract --profile extract`.
[profile.extract]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
