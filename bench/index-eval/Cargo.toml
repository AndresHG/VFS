# VFS-2: SQLite FTS5 vs Tantivy for the Spanish content index (dev-machine tool, not part of
# the app). Standalone package so Tantivy never enters the VFS workspace.
[package]
name = "index-eval"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
tantivy = ["dep:tantivy"]

[dependencies]
vfs-core = { path = "../../crates/vfs-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
rust-stemmers = "1.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
libc = "0.2"
tantivy = { version = "=0.27.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
