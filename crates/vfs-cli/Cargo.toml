[package]
name = "vfs-cli"
description = "VFS command line: index, search, synthetic data and benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vfs"
path = "src/main.rs"

[features]
default = []
# VFS-2 prototype: `content-index`, `content-search`, `content-off`; and VFS-28 `ask`. Off by
# default.
content = ["dep:vfs-content", "dep:vfs-ai", "dep:chrono"]

[dependencies]
vfs-core.workspace = true
vfs-bookmarks.workspace = true
vfs-content = { path = "../vfs-content", optional = true }
vfs-ai = { path = "../vfs-ai", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
# Only for `Transaction`/`Connection` around `vfs_core::db::ingest` in `gen-db`.
rusqlite.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
vfs-bookmarks = { workspace = true, features = ["test-support"] }
dunce.workspace = true
