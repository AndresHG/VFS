[package]
name = "vfs-cli"
description = "VFS command line: index, search, synthetic data and benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vfs"
path = "src/main.rs"

[dependencies]
vfs-core.workspace = true
vfs-bookmarks.workspace = true
# Only for `Transaction`/`Connection` around `vfs_core::db::ingest` in `gen-db`.
rusqlite.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
vfs-bookmarks = { workspace = true, features = ["test-support"] }
