[package]
name = "vfs-core"
description = "Index, folding and search core of VFS (no UI dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
log.workspace = true
dunce.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(windows))'.dependencies]
notify.workspace = true

[target.'cfg(windows)'.dependencies]
# VFS-27 R7: the idle probe (GetLastInputInfo).
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
# Cloud Files placeholders in tests (issue 170): a real sync root, as OneDrive makes one.
windows-sys = { workspace = true, features = ["Win32_Storage_CloudFilters", "Win32_System_CorrelationVector"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
