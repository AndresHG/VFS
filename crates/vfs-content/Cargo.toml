[package]
name = "vfs-content"
description = "Document content search for VFS (VFS-2 prototype): isolated extraction, Spanish BM25 index, snippets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "vfs-extract"
path = "src/bin/vfs-extract.rs"
required-features = ["extractor"]

[features]
default = ["extractor"]
# Xberg and the worker: the `vfs-extract` binary and the CLI's worker mode (VFS-2 D3).
extractor = ["dep:xberg", "dep:tokio"]
# `testing`: write documents into the content store from other crates' tests (VFS-29).
test-support = []

[dependencies]
vfs-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
rust-stemmers = "1.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust PDF backend plus office and spreadsheet extractors; no OCR, models or network.
xberg = { version = "=1.4.2", default-features = false, features = ["pdf", "office", "excel"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects"] }

[dev-dependencies]
tempfile.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
