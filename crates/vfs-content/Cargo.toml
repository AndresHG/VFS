[package]
name = "vfs-content"
description = "Document content search for VFS (VFS-2 prototype): isolated extraction, Spanish BM25 index, snippets"
version.workspace = true
edition.workspace = true
rust-version = "1.99"  # xberg 1.4 requires 1.99
publish.workspace = true

[[bin]]
name = "vfs-extract"
path = "src/bin/vfs-extract.rs"

[dependencies]
vfs-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
rust-stemmers = "1.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust PDF backend plus office and spreadsheet extractors; no OCR, models or network.
xberg = { version = "=1.4.2", default-features = false, features = ["pdf", "office", "excel"] }
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
