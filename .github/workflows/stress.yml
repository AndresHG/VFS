name: stress

# Full-size robustness runs (VFS-3): hundreds of kill iterations, hostile trees at full size,
# heavier property tests and a 30-minute soak. Too slow for every PR. Actions are pinned by
# commit SHA as in ci.yml; the toolchain comes from rust-toolchain.toml.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VFS_STRESS: "1"
  VFS_SOAK_SECS: "1800"

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Hostile trees and properties
        run: cargo test --release --locked -p vfs-core --test hostile --test props
      - name: Crash, concurrency and soak
        run: cargo test --release --locked -p vfs-cli --test crash --test concurrency --test soak -- --test-threads=2
