# VFS-1 AC-14: a downloadable Windows installer and a macOS build, each with a SHA-256
# checksum file. Actions are pinned by commit SHA (tag in the comment); no build cache, so
# a release is built only from the locked sources. Build provenance attestation is left
# out: for a private repository it needs GitHub Enterprise Cloud.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAURI_CLI_VERSION: 2.12.6

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Build (unsigned)
        working-directory: apps/desktop/src-tauri
        run: npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build --ci --bundles ${{ matrix.bundles }} -- --locked

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*-setup.exe)
          [ ${#files[@]} -eq 1 ] || { echo "expected one installer, found: ${files[*]}"; exit 1; }
          mkdir -p out && cp "${files[0]}" out/
          cd out && sha256sum -- *-setup.exe > SHA256SUMS.txt
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfs-windows-installer
          path: |
            out/*-setup.exe
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent target/release/bundle/macos/VFS.app "VFS-macos-$(uname -m).zip"
          shasum -a 256 VFS-macos-*.zip > SHA256SUMS.txt
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfs-macos
          path: |
            VFS-macos-*.zip
            SHA256SUMS.txt
          if-no-files-found: error
