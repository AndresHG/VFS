# VFS-1 AC-3: lint and tests on Windows and macOS for every push to main and every PR.
# Actions are pinned by commit SHA (tag in the comment); the toolchain comes from
# rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CLAUDE.md growth check compares against origin/main.
          fetch-depth: 0
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PR runs don't evict each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CLAUDE.md budget
        run: python3 scripts/claude_md_budget.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: UI tests
        run: node --test apps/desktop/ui-dev/status.test.mjs apps/desktop/ui-dev/screen.test.mjs apps/desktop/ui-dev/sources.test.mjs
      - name: Test content-search prototype (VFS-2, feature off by default)
        run: |
          cargo clippy -p vfs-cli --all-targets --features content -- -D warnings
          cargo test -p vfs-cli --features content --locked
