# VFS-1 AC-3: lint and tests on Windows and macOS for every push to main and every PR.
# Actions are pinned by commit SHA (tag in the comment); the toolchain comes from
# rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CLAUDE.md growth check compares against origin/main.
          fetch-depth: 0
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PR runs don't evict each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CLAUDE.md budget
        run: python3 scripts/claude_md_budget.py
      - name: Harness hook tests
        run: python3 -m unittest discover -s .claude/hooks -p "test_*.py"
      - name: No personal references
        run: python3 scripts/personal_refs.py
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: The app as released, without the AI (VFS-28, `ai` feature off until 0.4)
        run: cargo clippy -p vfs-desktop --lib --locked -- -D warnings
      - name: UI tests
        run: node --test apps/desktop/ui-dev/status.test.mjs apps/desktop/ui-dev/screen.test.mjs apps/desktop/ui-dev/sources.test.mjs apps/desktop/ui-dev/strings.test.mjs apps/desktop/ui-dev/fonts.test.mjs apps/desktop/ui-dev/updates.test.mjs apps/desktop/ui-dev/suggest.test.mjs apps/desktop/ui-dev/feedback.test.mjs apps/desktop/ui-dev/folders.test.mjs apps/desktop/ui-dev/layout.test.mjs apps/desktop/ui-dev/kinds.test.mjs apps/desktop/ui-dev/filefilter.test.mjs apps/desktop/ui-dev/content.test.mjs apps/desktop/ui-dev/filters.test.mjs apps/desktop/ui-dev/prefs.test.mjs apps/desktop/ui-dev/ai.test.mjs apps/desktop/ui-dev/ask.test.mjs apps/desktop/ui-dev/coregate.test.mjs apps/desktop/ui-dev/panels.test.mjs
      - name: Xberg stays out of the app (VFS-2 D3, VFS-27 D1)
        shell: bash
        run: |
          # The tree goes to a file first, so a failing `cargo tree` fails the step.
          cargo tree -p vfs-desktop -e normal --locked > "$RUNNER_TEMP/app-tree.txt"
          if grep -q ' xberg ' "$RUNNER_TEMP/app-tree.txt"; then
            echo "xberg is in the app's dependency graph"; exit 1; fi
      - name: Test content-search engine (VFS-2, feature off by default)
        run: |
          cargo clippy -p vfs-cli --all-targets --features content -- -D warnings
          cargo test -p vfs-cli --features content --locked
