# Temporary (issue 170): Cloud Files probe on Windows. Removed before the PR.
name: probe-170
on:
  push:
    branches: [feat/onedrive-listing]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo test -p vfs-core --lib cloud_probe -- --nocapture
