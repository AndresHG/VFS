# Throwaway probe for issue 109 (never merged).
name: scan-probe
on:
  push:
    branches: [wip/vfs-109-scan-probe]
permissions:
  contents: read
jobs:
  probe:
    if: false
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build probe
        run: cargo build --release -p vfs-core --example scan_probe --locked
      - name: Defender status
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusEnabled,IsTamperProtected | Format-List; Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
      - name: Probe runs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $tp = Start-Process typeperf -ArgumentList '"\PhysicalDisk(*)\Avg. Disk Queue Length"','"\PhysicalDisk(*)\Current Disk Queue Length"','"\Processor(_Total)\% Processor Time"','-si','1','-o','out\typeperf.csv','-y' -PassThru -NoNewWindow
          $exe = "target\release\examples\scan_probe.exe"
          $base = "$env:RUNNER_TEMP\probe"
          # A: tree generated right before the scan (as in the e2e journey)
          & $exe "$base\treeA" "$base\dbA\index.db" out\A-fresh-tree.log 100000 0
          # B: same tree, new index, after 60 s of calm
          & $exe "$base\treeA" "$base\dbB\index.db" out\B-calm-tree.log 100000 60
          # C: same tree, new index, whole indexer thread in background mode (pre-VFS-5)
          $env:VFS_PROBE_BG = "1"
          & $exe "$base\treeA" "$base\dbC\index.db" out\C-background-mode.log 100000 30
          Remove-Item Env:VFS_PROBE_BG
          Stop-Process -Id $tp.Id
          Get-ChildItem out | Format-Table Name,Length
          Select-String -Path out\*.log -Pattern 'summary|pass_end'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-probe
          path: out
  app:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Python packages
        run: python -m pip install --disable-pip-version-check psutil==7.2.2 pillow==13.0.0
      - name: Webdriver installer
        working-directory: apps/desktop/src-tauri
        run: npx --yes "@tauri-apps/cli@2.12.6" build --ci --bundles nsis --features webdriver -- --locked
      - name: Install
        run: |
          $installer = (Get-ChildItem "target\release\bundle\nsis\*-setup.exe").FullName
          $exe = & scripts/e2e/windows-install.ps1 -Installer $installer -Out out/install | Select-Object -Last 1
          "VFS_EXE=$exe" >> $env:GITHUB_ENV
      - name: Measure, current policy then pre-VFS-5 background mode
        run: |
          $tree = "$env:RUNNER_TEMP\e2e\Archivo"
          python scripts/e2e/gen_tree.py $tree --files 100000 --manifest "$env:RUNNER_TEMP\e2e\manifest.json"
          $appData = Join-Path $env:LOCALAPPDATA 'app.vfs.desktop'
          foreach ($label in @('current', 'bgmode')) {
            if (Test-Path $appData) { Remove-Item -Recurse -Force $appData }
            if ($label -eq 'bgmode') { $env:VFS_PROBE_BG = '1' } else { Remove-Item Env:VFS_PROBE_BG -ErrorAction SilentlyContinue }
            python scripts/e2e/measure.py --app $env:VFS_EXE --manifest "$env:RUNNER_TEMP\e2e\manifest.json" --label $label --out out/app --timeout 900
            Copy-Item -Recurse -Force (Join-Path $appData 'logs') "out/app/logs-$label" -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-probe-app
          path: out
